[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblioteca-kindle"
version = "0.1.0"
description = "Biblioteca personal local con Kindle como fuente de solo lectura"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
biblioteca-kindle = "biblioteca_kindle.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
biblioteca_kindle = ["migrations/*.sql"]

